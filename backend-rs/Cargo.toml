[package]
name = "task-board-backend"
version = "0.1.0"
edition = "2024"
description = "The task board's backend in Rust, taking over from the NestJS one in ../backend one part at a time"

[dependencies]
# The web server: routes, request handlers ("extractors" give a handler what it asks for)
axum = "0.8"
# GraphQL: the schema is written as Rust types, like NestJS's @ObjectType / @Resolver classes
async-graphql = "7"
# PostgreSQL, with plain SQL; chrono: date-and-time columns (timestamptz) read as chrono's DateTime
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "macros", "chrono"] }
# Dates and times (when a board was made), and writing them the way NestJS sends them; clock: the server's own
# date, for the chat's "Today is ..."
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# Runs async code (every request handler is an `async fn`); fs: the uploaded files; time: the hourly clean-up
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "fs", "time"] }
# Sends a stored file to the browser bit by bit (a stream), without reading it all into memory first
tokio-util = { version = "0.7", features = ["io"] }
# Reads uploads (multipart/form-data, the way a browser sends a file); axum uses it too
multer = "3"
# Reads a form body (a=1&b=2), which Apollo also takes on /graphql
form_urlencoded = "1"
# Layer: wraps the whole app, so the address can be tidied (like Express) before the routes are looked at
tower-layer = "0.3"
# An HTTP client, for passing requests on to NestJS
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
# CORS: which website may call this backend with your login cookie
tower-http = { version = "0.6", features = ["cors"] }
# The login cookie is a JWT; this signs and checks it
jsonwebtoken = "9"
# Password hashes, the same kind NestJS makes (argon2id), so existing passwords keep working
argon2 = "0.5"
# The runner's token: made from random bytes written in base64url, and saved only as its SHA-256 hash
base64 = "0.22"
sha2 = "0.10"
# Patterns for checking text (email addresses, invisible characters in names)
regex = "1"
# Every time zone name, to check the one the browser sends
chrono-tz = { version = "0.10", features = ["case-insensitive"] }
# Dates in the format cookies use ("Thu, 29 Oct 2026 08:15:40 GMT")
httpdate = "1"
# Turning JSON into Rust types and back
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] } # keys in the order they were written, as NestJS sends them
# Reads ../backend/.env, the settings file NestJS uses
dotenvy = "0.15"
# Log lines (tracing::info!, tracing::error!) printed with the time and level
tracing = "0.1"
tracing-subscriber = "0.3"
